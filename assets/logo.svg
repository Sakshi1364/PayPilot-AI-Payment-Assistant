<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="paypilotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003087" />
      <stop offset="50%" stop-color="#0079C1" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00457C" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#003087" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="url(#paypilotGrad)" filter="url(#shadow)" />
  
  <!-- Outer subtle circuit/radar ring -->
  <circle cx="100" cy="100" r="65" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" stroke-dasharray="6 6"/>

  <!-- AI Pilot Sparkles / Nodes -->
  <circle cx="145" cy="55" r="5" fill="#00D2FF" />
  <circle cx="55" cy="145" r="4" fill="#A5B4FC" />
  
  <!-- Stylized Monogram P and Flying Pilot Wing / Arrow -->
  <!-- Primary P -->
  <path d="M68 60 H105 C122 60 134 72 134 88 C134 104 122 116 105 116 H86 V140 H68 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <path d="M86 78 H103 C112 78 118 83 118 88 C118 94 112 99 103 99 H86 Z" fill="url(#paypilotGrad)"/>
  
  <!-- Sleek Forward Jet/Pilot Arrow indicating AI Autopilot for Payments -->
  <path d="M108 85 L148 65 L128 105 L118 92 Z" fill="url(#accentGrad)" opacity="0.95" />
</svg>
